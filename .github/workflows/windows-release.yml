name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --name configforge-windows-x64 configforge.py

      - name: Create checksums
        shell: pwsh
        run: |
          (Get-FileHash "dist/configforge-windows-x64.exe" -Algorithm SHA256).Hash + "  configforge-windows-x64.exe" | Out-File dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/configforge-windows-x64.exe
            dist/SHA256SUMS.txt
